[project]
name = "grid-search-algorithms"
version = "1.0.0"
description = "BFS, iterative deepening and weighted A* compared on a constrained grid pathfinding problem"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pathfinding = "pathfinding.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pathfinding*"]
